name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Verify layout
        run: |
          ls -la
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build.log

      - name: Show error tail
        if: always()
        run: tail -60 build.log || true

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Collect APK
        if: success()
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name '*.apk' -exec cp {} dist/patcher-debug.apk \;

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: patcher-debug-apk
          path: dist/
          if-no-files-found: error
