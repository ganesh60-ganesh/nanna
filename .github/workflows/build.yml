name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - name: Verify project layout
        run: |
          echo "--- repo root ---"
          ls -la
          test -f settings.gradle.kts || { echo "::error::settings.gradle.kts missing from repo root"; exit 1; }
          test -f app/build.gradle.kts || { echo "::error::app/build.gradle.kts missing"; exit 1; }
          test -f app/src/main/AndroidManifest.xml || { echo "::error::manifest missing"; exit 1; }

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name '*.apk' -exec cp {} dist/patcher.apk \;

      - uses: actions/upload-artifact@v4
        with:
          name: patcher-apk
          path: dist/
          if-no-files-found: error
