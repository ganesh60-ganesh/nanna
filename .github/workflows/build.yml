name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:
    inputs:
      variant:
        description: Build variant
        type: choice
        default: release
        options: [release, debug]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Build
        run: ./gradlew assemble${{ github.event.inputs.variant || 'Release' }} --no-daemon --stacktrace

      - name: Rename artifact
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name '*.apk' -exec cp {} dist/patcher.apk \;
          sha256sum dist/patcher.apk > dist/patcher.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: patcher-apk-${{ github.sha }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/patcher.apk
          generate_release_notes: true
